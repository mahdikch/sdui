pluginManagement {
    repositories {
        gradlePluginPortal()
        // Offline-friendly stubs / mirrors when dl.google.com is unreachable
        maven { url uri("${settingsDir}/local-maven-repo") }
        maven { url "https://maven.aliyun.com/repository/google" }
        maven { url "https://maven.aliyun.com/repository/public" }
        google()
        mavenCentral()
        jcenter()
        maven { url "https://jitpack.io" }
    }
    includeBuild('api-generator-plugin')
    includeBuild('screenshot-test-plugin')
}

dependencyResolutionManagement {
    versionCatalogs {
        def internalVersions = file("gradle/internal.versions.toml")
        if (internalVersions.exists()) {
            create("internalLibs") {
                from(files(internalVersions))
            }
        }
    }
}

rootProject.name = 'divkit-android'

include ':api-generator-test'
include ':assertion'
include ':beacon'
