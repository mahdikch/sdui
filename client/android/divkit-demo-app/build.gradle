configurations.configureEach {
    exclude group: 'androidx.lifecycle', module: 'lifecycle-runtime-desktop'
    exclude group: 'androidx.lifecycle', module: 'lifecycle-viewmodel-desktop'
    resolutionStrategy {
        // Keep core on 1.13.1 for AGP 8.1 / compileSdk 34.
        force 'androidx.core:core:1.13.1'
        force 'androidx.core:core-ktx:1.13.1'
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.10'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.10'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.10'
        force 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
        force 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1'
        force 'org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:1.8.1'
        def lifecycle = '2.8.7'
        force "androidx.lifecycle:lifecycle-runtime-android:$lifecycle"
        force "androidx.lifecycle:lifecycle-viewmodel-android:$lifecycle"
        force "androidx.lifecycle:lifecycle-process:$lifecycle"
        force "androidx.lifecycle:lifecycle-common:$lifecycle"
        force "androidx.lifecycle:lifecycle-livedata:$lifecycle"
        force "androidx.lifecycle:lifecycle-livedata-core:$lifecycle"
    }
}

screenshotTests {
    var isInIde = System.getProperty("idea.active") == "true"
    enabled = project.hasProperty("screenshot-tests") || isInIde
    enableComparison = !project.hasProperty("disable-screenshot-comparison")
    strictComparison = project.hasProperty("screenshot-strict-comparison")
    testAnnotations = ["com.yandex.test.screenshot.Screenshot"]
    referencesDir = "src/screenshotTest/screenshots"
    if (project.hasProperty("screenshot-dir")) {
        screenshotDir = project.property("screenshot-dir")
    }
}

android.applicationVariants.configureEach { variant ->

    variant.outputs.configureEach {
        boolean isPerf = variant.baseName.contains("perf")

        if (!isPerf) {
            outputFileName = divkitVersion.buildNumber != 0 ?
                    "${project.archivesBaseName}-v${versionName}-b${divkitVersion.buildNumber}-${variant.baseName}.apk" :
                    "${project.archivesBaseName}-v${versionName}-${variant.baseName}.apk"
        }
    }
}

FileExtensions.ifExists("${project.projectDir}/build.internal.gradle") {
    apply from: it
}

// Force a full package when intermediates are left in a bad state on Windows.
// doNotTrackState() breaks packageDebug on Gradle 8.x ("Changes are not tracked").
tasks.matching { it.name == "packageDebug" }.configureEach {
    outputs.upToDateWhen { false }
}
