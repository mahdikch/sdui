import com.yandex.div.gradle.FileExtensions
import groovy.json.JsonOutput

plugins {
    id 'com.android.application'
    id 'kotlin-parcelize'
    alias(libs.plugins.screenshotTestPlugin)
    id 'kotlin-kapt'
    id 'org.jetbrains.kotlin.android'
//    id 'org.jetbrains.kotlin.plugin.compose'

}

apply from: "${project.projectDir}/../div-application.gradle"
apply from: "${project.projectDir}/../div-tests.gradle"
apply from: "ui-tests.gradle"

repositories {
    maven { url 'https://repo.gradle.org/gradle/libs-releases' }
    maven { url 'https://jitpack.io' }
    maven {

        url = uri("https://api.mapbox.com/downloads/v2/releases/maven")

        // Do not change the username below. It should always be "mapbox" (not your username).

        credentials.username = "mapbox"
        // Token must live in local.properties / CI secrets — never hardcode in VCS.
        def mapboxToken = (project.findProperty("MAPBOX_DOWNLOADS_TOKEN") ?: "") as String
        def localPropsFile = rootProject.file("local.properties")
        if (mapboxToken.isEmpty() && localPropsFile.exists()) {
            def localProps = new Properties()
            localPropsFile.withInputStream { localProps.load(it) }
            mapboxToken = localProps.getProperty("MAPBOX_DOWNLOADS_TOKEN", "")
        }
        credentials.password = mapboxToken
        authentication { basic(BasicAuthentication) }

    }
}

android {
    namespace 'com.yandex.divkit.demo'
//    versionName "1.0.0"
//    versionCode 1
    buildFeatures {
        buildConfig = true
        viewBinding = true
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.3" // Use the latest version
    }
    defaultConfig {
//        versionCode divkitVersion.versionCode + divkitVersion.buildNumber
        versionCode 18
        versionName "1.1.8"

        buildConfigField "int", "BUILD_NUMBER", "${divkitVersion.buildNumber}"
        buildConfigField "String", "METRICA_API_KEY", JsonOutput.toJson(project.findProperty("metricaApiKey") ?: "")
        buildConfigField "boolean", "THROW_ASSERTS", project.hasProperty("screenshot-tests")? "false" : "true"
        buildConfigField "String", "HTTP_HEADERS", JsonOutput.toJson(project.findProperty("httpHeaders") ?: "{}")
        // Set release signing cert SHA-256 (hex, no colons) to enforce anti-repack checks.
        buildConfigField "String", "EXPECTED_CERT_SHA256", JsonOutput.toJson(project.findProperty("expectedCertSha256") ?: "")

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        if (!project.hasProperty("include-regression-tests")) {
            testInstrumentationRunnerArguments.notAnnotation = "com.yandex.alicekit.uitests.annotations.Regression"
        }
    }

    // Prefer v2/v3 APK Signature Scheme (v1 alone is vulnerable to Janus).
    signingConfigs {
        debug {
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
        release {
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            def storePath = project.findProperty("RELEASE_STORE_FILE")
            def storePass = project.findProperty("RELEASE_STORE_PASSWORD")
            def keyAliasName = project.findProperty("RELEASE_KEY_ALIAS")
            def keyPass = project.findProperty("RELEASE_KEY_PASSWORD")
            if (storePath && storePass && keyAliasName && keyPass) {
                storeFile file(storePath)
                storePassword storePass
                keyAlias keyAliasName
                keyPassword keyPass
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles  'proguard-rules.pro'
            signingConfig signingConfigs.debug
            // Emulator (generic_x86) + real 64-bit devices
            ndk {
                abiFilters 'arm64-v8a', 'x86'
            }
        }
        release {
            minifyEnabled true
            // Keep false: SDUI may reference res drawables by name; shrinking can strip them.
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
            ndk {
                abiFilters 'arm64-v8a'
            }
        }
    }


    sourceSets {
        main {
            assets.srcDirs += "../../../test_data/"
        }

        debug {
            // Append — do not replace default src/debug/java (DebugStetho etc.).
            java.srcDirs += ['src/public/java']
        }

        release {
            java.srcDirs += ['src/public/java']
        }

        test {
            resources.srcDirs += 'src/main/assets' // needed to access assets in unit tests.
        }

        androidTest {
            java.srcDirs += 'src/screenshotTest/java'
        }
    }

    lint {
//        baseline file("lint-baseline.xml")
        checkReleaseBuilds false
        abortOnError false
    }

    packaging {
        jniLibs {
            // Drop unused ABIs; keep x86 for debug emulator installs.
            excludes += ['**/armeabi-v7a/**', '**/x86_64/**']
            pickFirsts += [
                    '**/libc++_shared.so',
                    '**/libonnxruntime.so',
                    '**/libomp.so'
            ]
        }
    }
//    compileOptions {
//        sourceCompatibility JavaVersion.VERSION_11
//        targetCompatibility JavaVersion.VERSION_11
//    }
//    kotlinOptions {
//        jvmTarget = '11'
//    }
}

