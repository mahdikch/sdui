apply plugin: 'groovy'
apply plugin: 'kotlin'

repositories {
    maven { url "https://maven.aliyun.com/repository/public" }
    mavenCentral()
    jcenter()
    maven { url "https://jitpack.io" }
}

dependencies {
    implementation gradleApi()
    implementation libs.kotlin.reflect
}

buildscript {
    repositories {
        maven { url "https://maven.aliyun.com/repository/public" }
        mavenCentral()
        jcenter()
        maven { url "https://jitpack.io" }
    }

    dependencies {
        classpath libs.kotlin.gradle.plugin
    }
}
